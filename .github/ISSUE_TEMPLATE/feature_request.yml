name: Feature request
description: Propose a mechanism worth its lines
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >
        `pocket` trades capability for legibility on purpose: one mechanism, one
        file, no dependencies, readable in an evening. The best proposals say
        what mechanism is missing — not which framework to add.
  - type: textarea
    id: problem
    attributes:
      label: What can't you do today
    validations:
      required: true
  - type: textarea
    id: mechanism
    attributes:
      label: The mechanism you have in mind
      description: Which file would it be? What would its docstring say it is for?
    validations:
      required: true
  - type: textarea
    id: cost
    attributes:
      label: What it costs
      description: >
        New dependency? More lines in every prompt? A knob? A slower gate?
        Naming the cost makes the trade reviewable.
  - type: textarea
    id: eval
    attributes:
      label: How a deterministic eval would prove it works
